name: Validate templates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      XLSX2AI_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Installer dry run smoke test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/demo" && touch "$RUNNER_TEMP/demo/pom.xml" "$RUNNER_TEMP/demo/mvnw"
          python scripts/install.py project "$RUNNER_TEMP/demo"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HTMX_CHECK_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0 htmx.org@2.0.4
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest tests.test_htmx_check -v
  sample-app:
    # Real Spring Boot + JSP + HTMX app: installer, mvnw verify, Stop hook against
    # real javac output, and htmx-check.mjs against the running server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0 htmx.org@2.0.4
      - run: npx playwright install --with-deps chromium
      - run: bash tests/e2e_sample_app.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-e2e
          path: e2e-output/
          if-no-files-found: ignore
