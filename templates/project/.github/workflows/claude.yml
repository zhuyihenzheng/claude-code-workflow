name: Claude mentions

# 事前に Claude GitHub App をインストールし、ANTHROPIC_API_KEY を設定する。
# サブスクリプション認証を使用する場合は、anthropic_api_key を claude_code_oauth_token に置き換える。
# 任意の自動レビューは、別テンプレート claude-review.yml.example を使用する。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: "--max-turns 20 --max-budget-usd 5"
          # action の標準の書き込み権限チェックを維持する。すべての bot や
          # allowed_non_write_users: '*' を許可しない。このジョブはコードを変更できる構成となっている。
